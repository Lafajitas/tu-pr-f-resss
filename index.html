<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu préfères ?</title>
<style>
  :root{--card:rgba(255,255,255,.7);--txt:#4a2c3a;--mut:#7d5d6b;--acc:#e8566f}
  *{box-sizing:border-box;margin:0}
  body{background:linear-gradient(160deg,#d6f1e1 0%,#fff3df 50%,#ffd6dc 100%) fixed;color:var(--txt);font-family:ui-rounded,"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px;overflow-x:hidden}
  #snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  main{width:100%;max-width:860px;position:relative;z-index:1;padding-top:30px}
  h1{font-size:clamp(1.9rem,5.5vw,3rem);text-align:center;letter-spacing:-.02em;margin-top:8px}
  h1 span{display:inline-block;animation:wiggle 2.4s ease-in-out infinite}
  h1 span:last-child{animation-delay:.6s}
  @keyframes wiggle{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.15)}}
  @keyframes pop{from{opacity:0;transform:scale(.85) translateY(12px)}to{opacity:1;transform:none}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .duel .opt{animation:pop .35s ease-out both}
  .result-top .big{animation:bounce 1.2s ease-in-out infinite}
  .chip{backdrop-filter:blur(6px);font-size:1.5rem !important;padding:8px 14px !important}
  .sub{text-align:center;color:var(--mut);margin:8px 0 28px}
  .city-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:28px}
  .chip{background:var(--card);padding:6px 12px;border-radius:99px;font-size:.9rem}
  button{font:inherit;cursor:pointer;border:0}
  .start{display:block;margin:0 auto;background:var(--acc);color:#222;font-weight:700;padding:14px 32px;border-radius:99px;font-size:1.1rem;transition:transform .15s}
  .start:hover{transform:scale(1.05)}
  .bar{height:8px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:8px}
  .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
  .count{color:var(--mut);font-size:.9rem;text-align:center;margin-bottom:18px}
  .q{font-size:clamp(1.15rem,3.5vw,1.6rem);text-align:center;margin-bottom:24px;line-height:1.35}
  .q b{color:#c0334d}
  .start{background:linear-gradient(135deg,#f0657d,#d63a56) !important;color:#fff !important;box-shadow:0 6px 16px #d63a5655}
  #lights{position:fixed;top:0;left:0;right:0;height:46px;z-index:2;pointer-events:none;display:flex;justify-content:space-around;align-items:flex-start;border-top:3px solid #2f8f5b66}
  #lights i{width:12px;height:18px;border-radius:50% 50% 55% 55%;margin-top:3px;animation:twinkle 1.6s ease-in-out infinite;box-shadow:0 0 10px 3px currentColor;background:currentColor}
  @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
  @media(prefers-reduced-motion:reduce){#lights i{animation:none}}
  .duel{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
  .vs{align-self:center;color:var(--mut);font-weight:800}
  .opt{border-radius:20px;padding:28px 16px;color:#fff;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;min-height:200px;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 24px #0005}
  .opt:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 32px #0007}
  .opt:active{transform:scale(.97)}
  .opt .e{font-size:3.2rem}
  .opt .n{font-size:1.6rem;font-weight:800}
  .opt .t{font-size:1.15rem;font-weight:700;opacity:.95}
  .opt.win{outline:4px solid var(--acc)}
  .rank{list-style:none;padding:0;display:grid;gap:10px;margin:20px 0}
  .rank li{background:var(--card);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center}
  .rank .pos{font-size:1.3rem;text-align:center}
  .rank .nm{font-weight:700}
  .rank .meter{height:8px;border-radius:99px;background:#ffffff1a;margin-top:6px;overflow:hidden}
  .rank .meter i{display:block;height:100%;border-radius:99px}
  .rank .sc{color:var(--mut);font-size:.9rem;white-space:nowrap}
  .result-top{text-align:center;margin:8px 0}
  .result-top .big{font-size:4rem}
  .result-top h2{font-size:1.8rem}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .ghost{background:var(--card);color:var(--txt);padding:12px 22px;border-radius:99px}
  .ghost:hover{background:#fff}
  .ghost{color:var(--txt);font-weight:700}
  .rank .meter{background:rgba(74,44,58,.1) !important}
  .rank li{backdrop-filter:blur(6px)}
  @media(prefers-reduced-motion:reduce){h1 span,.result-top .big,.duel .opt{animation:none}}
  .msg{text-align:center;font-size:1.3rem;font-weight:800;color:#c0334d;margin:6px 0 14px}
  .hidden{display:none}
  @media(max-width:560px){.duel{grid-template-columns:1fr}.vs{justify-self:center}.opt{min-height:140px;padding:18px}}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="lights"></div>
<main>
  <h1><span>🎄</span> Tu préfères ? <span>🎅</span></h1>

  <section id="home">
    <div class="city-list" id="chips"></div>
    <button class="start" id="go">C'est parti ! 🎁</button>
  </section>

  <section id="game" class="hidden">
    <div class="bar"><i id="prog"></i></div>
    <div class="count" id="count"></div>
    <p class="q" id="q"></p>
    <div class="duel">
      <button class="opt" id="a"></button>
      <span class="vs">VS</span>
      <button class="opt" id="b"></button>
    </div>
  </section>

  <section id="end" class="hidden">
    <div class="result-top"><div class="big" id="wE"></div><h2 id="wN"></h2><p class="sub" id="wT"></p></div>
    <ol class="rank" id="rank"></ol>
    <p class="msg">💌 Envoie-moi ton classement !</p>
    <div class="row">
      <button class="start" id="again">Rejouer</button>
      <button class="ghost" id="copy">Copier mon classement</button>
    </div>
  </section>
</main>

<script>
const C = {
  vienne:{n:"Vienne",e:"🎻",c:"linear-gradient(135deg,#8e2de2,#4a00e0)",t:"Palais impériaux, cafés & opéra"},
  prague:{n:"Prague",e:"🏰",c:"linear-gradient(135deg,#f12711,#f5af19)",t:"Château, ponts & bières"},
  bruges:{n:"Bruges",e:"🚤",c:"linear-gradient(135deg,#11998e,#38ef7d)",t:"Canaux, chocolat & Moyen Âge"},
  berlin:{n:"Berlin",e:"🧱",c:"linear-gradient(135deg,#434343,#7b7f8c)",t:"Histoire, street art & clubs"},
  amsterdam:{n:"Amsterdam",e:"🚲",c:"linear-gradient(135deg,#ff6a00,#ee0979)",t:"Vélos, canaux & musées"},
  dublin:{n:"Dublin",e:"🍀",c:"linear-gradient(135deg,#0f9b0f,#06623b)",t:"Pubs, musique live & Guinness"},
  madrid:{n:"Madrid",e:"💃",c:"linear-gradient(135deg,#e53935,#b71c1c)",t:"Tapas, soleil & vie nocturne"},
  rome:{n:"Rome",e:"🏛️",c:"linear-gradient(135deg,#c79100,#8d6e00)",t:"Antiquité, pasta & dolce vita"}
};
const Q = [
 ["vienne","prague","Un soir en ville : <b>opéra et café élégant</b> ou <b>bières et ponts illuminés</b> ?"],
 ["bruges","amsterdam","Sur l'eau : <b>ruelles médiévales calmes</b> ou <b>vélos et péniches animées</b> ?"],
 ["berlin","dublin","Pour sortir : <b>clubs et street art</b> ou <b>pubs et musique live</b> ?"],
 ["madrid","rome","Au dîner : <b>tapas à minuit</b> ou <b>pâtes sous les ruines</b> ?"],
 ["vienne","bruges","Gourmandise : <b>Sachertorte</b> ou <b>chocolat belge et gaufres</b> ?"],
 ["prague","madrid","Ambiance : <b>vieille ville gothique</b> ou <b>terrasses ensoleillées</b> ?"],
 ["berlin","amsterdam","Musée : <b>histoire du Mur</b> ou <b>Van Gogh et Rijksmuseum</b> ?"],
 ["dublin","rome","Balade : <b>falaises et campagne verte</b> ou <b>Colisée et fontaines</b> ?"],
 ["vienne","berlin","Culture : <b>palais impériaux</b> ou <b>scène alternative</b> ?"],
 ["prague","bruges","Week-end à deux : <b>château et ruelles gothiques</b> ou <b>beffroi et canaux paisibles</b> ?"],
 ["amsterdam","madrid","Énergie : <b>cool et tolérante</b> ou <b>festive jusqu'à l'aube</b> ?"],
 ["dublin","vienne","Soirée : <b>pub chaleureux</b> ou <b>salon de musique élégant</b> ?"],
 ["rome","berlin","Découvrir : <b>2000 ans d'histoire antique</b> ou <b>histoire contemporaine</b> ?"],
 ["bruges","dublin","Météo ou pas : <b>brumes romantiques de Flandre</b> ou <b>pluie irlandaise et pinte</b> ?"],
 ["madrid","vienne","Culture : <b>Prado et flamenco</b> ou <b>Klimt et valse</b> ?"],
 ["amsterdam","prague","Un jour de congé : <b>louer un vélo</b> ou <b>grimper au château</b> ?"],
 ["rome","prague","Photo souvenir : <b>fontaine de Trevi</b> ou <b>pont Charles</b> ?"]
];
const $ = id => document.getElementById(id);
let order, idx, score, seen;

/* Guirlande lumineuse */
(function(){
  const cols=["#e8334f","#2fa866","#f5b82e","#3b9be8"], box=$("lights");
  const n=Math.max(8,Math.round(innerWidth/55));
  for(let i=0;i<n;i++){
    const b=document.createElement("i");
    b.style.color=cols[i%cols.length];
    b.style.animationDelay=(i%4*.4)+"s";
    b.style.marginTop=(i%2?3:10)+"px";
    box.appendChild(b);
  }
})();

/* Flocons de neige en fond */
(function(){
  const cv=$("snow"), cx=cv.getContext("2d");
  let W,H,flakes=[];
  function size(){
    const d=window.devicePixelRatio||1;
    W=innerWidth; H=innerHeight;
    cv.width=W*d; cv.height=H*d;
    cx.setTransform(d,0,0,d,0,0);
  }
  function make(top){
    return {x:Math.random()*W, y:top?-10:Math.random()*H, r:1.5+Math.random()*4,
            v:.5+Math.random()*1.4, s:Math.random()*Math.PI*2, w:.01+Math.random()*.02, o:.5+Math.random()*.5};
  }
  size(); addEventListener("resize",size);
  const n=Math.min(130,Math.round(innerWidth/9));
  for(let i=0;i<n;i++) flakes.push(make(false));
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  (function tick(){
    cx.clearRect(0,0,W,H);
    for(const f of flakes){
      f.y+=f.v; f.s+=f.w; f.x+=Math.sin(f.s)*.6;
      if(f.y>H+10){Object.assign(f,make(true));}
      cx.beginPath(); cx.arc(f.x,f.y,f.r,0,6.283);
      cx.fillStyle="rgba(255,255,255,"+f.o+")"; cx.fill();
      cx.strokeStyle="rgba(120,160,210,.55)"; cx.lineWidth=1; cx.stroke();
    }
    requestAnimationFrame(tick);
  })();
})();

$("chips").innerHTML = Object.values(C).map(c => `<span class="chip">${c.e}</span>`).join("");

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){["home","game","end"].forEach(s=>$(s).classList.toggle("hidden",s!==id))}

function start(){
  order = shuffle(Q.map(q=>q.slice()));
  order.forEach(q=>{ if(Math.random()<.5){ const t=q[0]; q[0]=q[1]; q[1]=t; } });
  idx = 0; score = {}; seen = {};
  Object.keys(C).forEach(k=>{score[k]=0;seen[k]=0});
  show("game"); render();
}
function fill(btn,key){
  const c=C[key];
  btn.style.background=c.c;
  btn.innerHTML=`<span class="e">${c.e}</span><span class="t">${c.t}</span>`;
  btn.dataset.k=key;
  btn.style.animation="none"; void btn.offsetWidth; btn.style.animation="";
}
function render(){
  const q=order[idx];
  $("prog").style.width=(idx/order.length*100)+"%";
  $("count").textContent=`Duel ${idx+1} / ${order.length}`;
  $("q").innerHTML=q[2];
  fill($("a"),q[0]); fill($("b"),q[1]);
}
function pick(btn){
  const q=order[idx], w=btn.dataset.k;
  score[w]++; seen[q[0]]++; seen[q[1]]++;
  btn.classList.add("win");
  setTimeout(()=>{btn.classList.remove("win"); idx++; idx<order.length?render():finish();},220);
}
function ranking(){
  return Object.keys(C).map(k=>({k,w:score[k],s:seen[k],r:seen[k]?score[k]/seen[k]:0}))
    .sort((a,b)=>b.r-a.r||b.w-a.w);
}
function finish(){
  $("prog").style.width="100%";
  const r=ranking(), medals=["🥇","🥈","🥉"], top=C[r[0].k];
  $("wE").textContent=top.e;
  $("wN").textContent="Tu préfères… ✨";
  $("wT").textContent=top.t;
  $("rank").innerHTML=r.map((x,i)=>`<li><span class="pos">${medals[i]||i+1}</span>
    <div><div class="nm">${C[x.k].e} ${C[x.k].t}</div><div class="meter"><i style="width:${Math.round(x.r*100)}%;background:${C[x.k].c}"></i></div></div>
    <span class="sc">${x.w}/${x.s} duels</span></li>`).join("");
  show("end");
}
$("go").onclick=start; $("again").onclick=start;
$("a").onclick=e=>pick(e.currentTarget); $("b").onclick=e=>pick(e.currentTarget);
$("copy").onclick=async()=>{
  const t="Mon classement 🎄 :\n"+ranking().map((x,i)=>`${i+1}. ${C[x.k].e} ${C[x.k].t} (${x.w}/${x.s})`).join("\n");
  try{await navigator.clipboard.writeText(t);$("copy").textContent="Copié ✅"}catch(e){$("copy").textContent="Copie impossible"}
};
</script>
</body>
</html>
